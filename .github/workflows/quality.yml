name: Prime Scalp repository quality gate

on:
  push:
    branches:
      - integration/prime-scalp-hub-audited
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/quality.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prime-scalp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.0" "python-dotenv>=1.0" "pytest>=8.0"
      - name: Verify unified strategy suite is present
        run: test -s prime_scalp_strategy_suite.py
      - name: Compile all Python source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path(".").rglob("*.py")
                   if not set(p.parts) & {".git", ".venv", "venv", "__pycache__"}]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
      - name: Run test suite
        run: python -m pytest -q
