name: Prime Scalp focused quality gate

on:
  push:
    branches:
      - integration/prime-scalp-hub-audited
    paths:
      - "config.py"
      - "tests/test_config.py"
      - ".github/workflows/quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "config.py"
      - "tests/test_config.py"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

concurrency:
  group: prime-scalp-focused-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check "pydantic>=2.0" "python-dotenv>=1.0" "pytest>=8.0"
      - name: Compile configuration and tests
        run: python -m py_compile config.py tests/test_config.py
      - name: Run focused configuration tests
        run: python -m pytest -q tests/test_config.py
